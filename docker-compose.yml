services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: mindspace-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: mindspace
      POSTGRES_PASSWORD: mindspace
      POSTGRES_DB: mindspace
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mindspace -d mindspace"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
